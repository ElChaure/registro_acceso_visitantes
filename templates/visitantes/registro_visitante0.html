{% extends "base.html" %}
{% load static %}

{% block title %}Registrar Visitante{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Registrar Nuevo Visitante</h4>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre *</label>
                                    <input type="text" name="nombre" id="nombre" class="form-control" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="apellido" class="form-label">Apellido *</label>
                                    <input type="text" name="apellido" id="apellido" class="form-control" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="documento" class="form-label">Documento de Identidad *</label>
                                    <input type="text" name="documento" id="documento" class="form-control" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <input type="text" name="telefono" id="telefono" class="form-control">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" name="email" id="email" class="form-control">
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="sede" class="form-label">Sede *</label>
                                    <select name="sede" id="sede" class="form-control" required>
                                        <option value="">Seleccione una sede</option>
                                        {% for sede in sedes %}
                                        <option value="{{ sede.id }}">{{ sede.nombre }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="dependencia" class="form-label">Dependencia *</label>
                                    <select name="dependencia" id="dependencia" class="form-control" required>
                                        <option value="">Seleccione una dependencia</option>
                                        {% for dep in dependencias %}
                                        <option value="{{ dep.id }}">{{ dep.nombre }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="persona_solicitada" class="form-label">Persona Solicitada *</label>
                            <input type="text" name="persona_solicitada" id="persona_solicitada" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <textarea name="observaciones" id="observaciones" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="foto" class="form-label">Foto (opcional)</label>
                            <input type="file" name="foto" id="foto" class="form-control" accept="image/*">
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> El código de carnet se generará automáticamente.
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Registrar Visitante
                            </button>
                            <a href="{% url 'core:dashboard' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
